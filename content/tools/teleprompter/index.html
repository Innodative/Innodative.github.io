<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course Teleprompter | The Innodative Disruptor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* ---- BASE (Tufte-inspired, matches innodative.com) ---- */
  body {
    background: #fffff8;
    color: #111;
    font-family: et-book, Palatino, "Palatino Linotype", "Palatino LT STD", "Book Antiqua", Georgia, serif;
    height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #151515; color: #dcdcdc; }
  }

  /* ---- PASTE MODE (Tufte aesthetic, matches site) ---- */
  #paste-mode {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    padding: 3rem 2rem;
    overflow-y: auto;
  }
  #paste-mode nav.breadcrumb {
    align-self: flex-start;
    max-width: 820px;
    width: 100%;
    margin: 0 auto 1.5rem;
    font-size: 0.9rem;
  }
  #paste-mode nav.breadcrumb a {
    color: inherit;
    text-decoration: none;
    border-bottom: 1px dotted #999;
  }
  #paste-mode h1 {
    font-size: 2rem;
    font-weight: 400;
    font-style: italic;
    margin-bottom: 0.4rem;
    letter-spacing: 0.01em;
  }
  #paste-mode .subtitle {
    font-style: italic;
    color: #666;
    margin-bottom: 1.5rem;
    font-size: 1rem;
    text-align: center;
    max-width: 600px;
  }
  @media (prefers-color-scheme: dark) {
    #paste-mode .subtitle { color: #999; }
  }
  #paste-mode textarea {
    width: 100%;
    max-width: 760px;
    height: 45vh;
    min-height: 300px;
    background: #fffff8;
    color: #111;
    border: 1px solid #ccc;
    border-radius: 2px;
    padding: 1.25rem;
    font-size: 1rem;
    line-height: 1.6;
    font-family: inherit;
    resize: vertical;
  }
  @media (prefers-color-scheme: dark) {
    #paste-mode textarea {
      background: #1a1a1a;
      color: #dcdcdc;
      border-color: #444;
    }
  }
  #paste-mode textarea:focus {
    outline: 1px solid #999;
    outline-offset: 2px;
  }
  #paste-mode .start-btn {
    margin-top: 1.5rem;
    padding: 0.6rem 1.75rem;
    font-size: 1rem;
    background: transparent;
    color: #111;
    border: 1px solid #333;
    border-radius: 2px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s;
  }
  @media (prefers-color-scheme: dark) {
    #paste-mode .start-btn {
      color: #dcdcdc;
      border-color: #888;
    }
  }
  #paste-mode .start-btn:hover { background: #eee; }
  @media (prefers-color-scheme: dark) {
    #paste-mode .start-btn:hover { background: #222; }
  }
  #paste-mode .hint {
    margin-top: 1.25rem;
    font-size: 0.85rem;
    color: #666;
    font-style: italic;
    text-align: center;
  }
  @media (prefers-color-scheme: dark) {
    #paste-mode .hint { color: #888; }
  }

  /* ---- PROMPTER MODE (functional, always dark) ---- */
  #prompter-mode {
    display: none;
    background: #000;
    color: #e8e8e8;
    height: 100vh;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    overflow: hidden;
  }
  #prompter-mode.active { display: block; }
  #prompter-title {
    position: absolute;
    top: 1rem;
    left: 50%;
    transform: translateX(-50%);
    font-size: 1rem;
    color: #888;
    font-style: italic;
    z-index: 10;
    text-align: center;
    max-width: 80%;
  }
  #prompter-content {
    position: absolute;
    top: 100vh;
    left: 0;
    right: 0;
    padding: 0 10%;
    font-family: Georgia, "Palatino Linotype", serif;
    font-size: 40px;
    line-height: 1.6;
    text-align: left;
  }
  #prompter-content p { margin-bottom: 1em; }
  .guide-line {
    position: absolute;
    top: 38%;
    left: 0;
    right: 0;
    border-top: 1px solid rgba(255, 60, 60, 0.35);
    z-index: 5;
    pointer-events: none;
  }
  #controls {
    position: absolute;
    bottom: 1rem;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 1.25rem;
    align-items: center;
    background: rgba(20, 20, 20, 0.88);
    padding: 0.6rem 1.1rem;
    border-radius: 4px;
    font-size: 0.85rem;
    color: #999;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    z-index: 10;
  }
  #controls input[type="range"] { width: 110px; }
  #controls .label { min-width: 2.8em; color: #777; }
  #controls .value { min-width: 3em; color: #bbb; }
  #controls button {
    background: transparent;
    color: #ccc;
    border: 1px solid #555;
    padding: 0.3rem 0.7rem;
    border-radius: 2px;
    cursor: pointer;
    font-size: 0.85rem;
    font-family: inherit;
  }
  #controls button:hover { background: #333; }
</style>
</head>
<body>

<div id="paste-mode">
  <nav class="breadcrumb">← <a href="/tools/">Tools</a></nav>
  <h1>Course Teleprompter</h1>
  <p class="subtitle">Paste a script. Production markup gets stripped. The first line becomes the title.</p>
  <textarea id="script-input" placeholder="Paste your script here. Markup like [ON SCREEN: ...], [B-ROLL: ...], and [VISUAL: ...] will be removed."></textarea>
  <button class="start-btn" onclick="startPrompter()">Start Teleprompter</button>
  <p class="hint">Once running: Space plays and pauses. ↑ and ↓ adjust speed. Esc returns here.</p>
</div>

<div id="prompter-mode">
  <div id="prompter-title"></div>
  <div class="guide-line"></div>
  <div id="prompter-content"></div>
  <div id="controls">
    <button onclick="togglePlay()" id="play-btn">Pause</button>
    <span class="label">Speed</span>
    <input type="range" id="speed-slider" min="0.5" max="5" step="0.1" value="1">
    <span class="value" id="speed-value">1.0x</span>
    <span class="label">Size</span>
    <input type="range" id="font-slider" min="28" max="56" step="2" value="40">
    <span class="value" id="font-value">40px</span>
    <button onclick="returnToPaste()">Exit</button>
  </div>
</div>

<script>
  let scrollPosition = 100; // vh, positive = below viewport
  let scrollSpeed = 1.0;
  let isPlaying = true;
  let animationFrame = null;
  let lastTimestamp = 0;

  function stripMarkup(text) {
    // Strip production callouts in brackets: [ON SCREEN: ...], [B-ROLL: ...], [VISUAL: ...], etc.
    text = text.replace(/\[[^\]]*\]/g, '');
    // Strip table border rows that Pages sometimes injects
    text = text.replace(/^\s*\|.*\|\s*$/gm, '');
    text = text.replace(/^\s*[-+]{3,}[-+|]*\s*$/gm, '');
    // Collapse multiple blank lines into max one
    text = text.replace(/\n\s*\n\s*\n+/g, '\n\n');
    return text.trim();
  }

  function startPrompter() {
    const raw = document.getElementById('script-input').value;
    if (!raw.trim()) {
      alert('Paste a script first.');
      return;
    }
    const cleaned = stripMarkup(raw);
    const lines = cleaned.split('\n');

    // First non-empty line is the title
    let titleIndex = lines.findIndex(l => l.trim());
    const title = titleIndex >= 0 ? lines[titleIndex].trim() : 'Untitled';
    const body = lines.slice(titleIndex + 1).join('\n').trim();

    document.getElementById('prompter-title').textContent = title;

    // Split body into paragraphs on blank lines
    const paragraphs = body.split(/\n\s*\n/).filter(p => p.trim());
    document.getElementById('prompter-content').innerHTML = paragraphs
      .map(p => '<p>' + p.replace(/\n/g, '<br>') + '</p>')
      .join('');

    document.getElementById('paste-mode').style.display = 'none';
    document.getElementById('prompter-mode').classList.add('active');

    scrollPosition = 100;
    isPlaying = true;
    document.getElementById('play-btn').textContent = 'Pause';
    document.getElementById('prompter-content').style.top = scrollPosition + 'vh';
    lastTimestamp = performance.now();
    if (animationFrame) cancelAnimationFrame(animationFrame);
    animationFrame = requestAnimationFrame(scroll);
  }

  function scroll(timestamp) {
    const delta = (timestamp - lastTimestamp) / 1000;
    lastTimestamp = timestamp;
    if (isPlaying) {
      // Base rate: 2.5vh per second at 1x speed. Adjusted by scrollSpeed.
      scrollPosition -= 2.5 * scrollSpeed * delta;
      document.getElementById('prompter-content').style.top = scrollPosition + 'vh';
    }
    animationFrame = requestAnimationFrame(scroll);
  }

  function togglePlay() {
    isPlaying = !isPlaying;
    document.getElementById('play-btn').textContent = isPlaying ? 'Pause' : 'Play';
  }

  function returnToPaste() {
    if (animationFrame) cancelAnimationFrame(animationFrame);
    animationFrame = null;
    document.getElementById('prompter-mode').classList.remove('active');
    document.getElementById('paste-mode').style.display = 'flex';
  }

  // Speed slider
  document.getElementById('speed-slider').addEventListener('input', (e) => {
    scrollSpeed = parseFloat(e.target.value);
    document.getElementById('speed-value').textContent = scrollSpeed.toFixed(1) + 'x';
  });

  // Font size slider
  document.getElementById('font-slider').addEventListener('input', (e) => {
    const size = e.target.value;
    document.getElementById('prompter-content').style.fontSize = size + 'px';
    document.getElementById('font-value').textContent = size + 'px';
  });

  // Keyboard shortcuts (only active in prompter mode)
  document.addEventListener('keydown', (e) => {
    if (!document.getElementById('prompter-mode').classList.contains('active')) return;
    switch (e.key) {
      case ' ':
        e.preventDefault();
        togglePlay();
        break;
      case 'ArrowUp':
        e.preventDefault();
        scrollSpeed = Math.min(5, scrollSpeed + 0.1);
        document.getElementById('speed-slider').value = scrollSpeed;
        document.getElementById('speed-value').textContent = scrollSpeed.toFixed(1) + 'x';
        break;
      case 'ArrowDown':
        e.preventDefault();
        scrollSpeed = Math.max(0.5, scrollSpeed - 0.1);
        document.getElementById('speed-slider').value = scrollSpeed;
        document.getElementById('speed-value').textContent = scrollSpeed.toFixed(1) + 'x';
        break;
      case 'Escape':
        returnToPaste();
        break;
    }
  });

  // Mouse wheel scroll when paused
  document.getElementById('prompter-mode').addEventListener('wheel', (e) => {
    if (isPlaying) return;
    e.preventDefault();
    scrollPosition -= e.deltaY * 0.05;
    document.getElementById('prompter-content').style.top = scrollPosition + 'vh';
  }, { passive: false });
</script>

</body>
</html>
